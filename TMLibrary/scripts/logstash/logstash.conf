# ============================================================================
# Logstash —— MySQL → Elasticsearch 定时同步(图书全量索引)
#
# 用途:把 books 表(含从 order_items 算出的热度)定期同步到
#       tmlibrary_books 索引,给关键字搜索(/books?keyword=)用。
#
# 起容器:见同目录 README.md。核心是三个环境变量:
#   MYSQL_HOST / MYSQL_PASSWORD / ES_PASSWORD —— 不要写死在配置里。
# ============================================================================

input {
  jdbc {
    jdbc_driver_library => "/usr/share/logstash/drivers/mysql-connector-j.jar"
    jdbc_driver_class   => "com.mysql.cj.jdbc.Driver"
    jdbc_connection_string => "jdbc:mysql://${MYSQL_HOST}:3306/tmlibrary?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
    jdbc_user     => "${MYSQL_USER}"
    jdbc_password => "${MYSQL_PASSWORD}"

    # ------------------------------------------------------------------
    # 同步语句
    #
    # 为什么不用 :sql_last_value 增量?
    #   「热度」来自 order_items(别人下单付款),而 books.updated_time 不会因此变化
    #   —— 用 updated_time 做游标的话,销量永远同步不过去。
    #   想增量就得在 books 上维护一列"热度版本号",由应用在付款时 touch 一下。
    #
    # 现在是**全量重读**:每次 schedule 触发都拉全表,靠 ES 侧的
    # document_id + doc_as_upsert 做幂等覆盖。
    # 12 本书的量级下这是最省心的做法;数据量上万后改成:
    #   1) 加 WHERE b.updated_time > :sql_last_value 做增量
    #   2) 热度单独用另一条 pipeline / 定时任务刷
    # ------------------------------------------------------------------
    statement => "
      SELECT b.isbn                     AS isbn,
             b.title                    AS title,
             b.author                   AS author,
             b.category_id              AS categoryId,
             c.name                     AS categoryName,
             b.price                    AS price,
             b.stock_quantity           AS stockQuantity,
             DATE_FORMAT(b.published_date, '%Y-%m-%d')            AS publishedDate,
             COALESCE(s.sold, 0)        AS hot,
             DATE_FORMAT(b.created_time, '%Y-%m-%d %H:%i:%s')     AS createdTime,
             DATE_FORMAT(b.updated_time, '%Y-%m-%d %H:%i:%s')     AS updatedTime
      FROM books b
      LEFT JOIN book_categories c ON c.id = b.category_id
      LEFT JOIN (
          SELECT oi.book_id, SUM(oi.quantity) AS sold
          FROM order_items oi
          INNER JOIN orders o ON o.id = oi.order_id AND o.order_status = 1
          GROUP BY oi.book_id
      ) s ON s.book_id = b.id
    "

    # 每 2 分钟跑一次。候选词/搜索对新鲜度的要求不高,2 分钟足够;
    # 想更实时就调密,但要留意全量重读的代价。
    schedule => "*/2 * * * *"

    # 每次启动都从头跑一遍(不做 last_run_metadata 续跑)——
    # 因为本来就是全量,续跑没有意义
    clean_run => true

    # 数字列保持数字类型,别让 Logstash 全转成字符串
    jdbc_fetch_size => 500
    lowercase_column_names => false
  }
}

filter {
  # JDBC input 出来的数值列类型已经正确,这里只做清洗:
  # 空字符串转 null(ES 的 date/integer 字段收到 "" 会报解析失败)
  mutate {
    gsub => [
      "publishedDate", "^$", "",
      "createdTime", "^$", "",
      "updatedTime", "^$", ""
    ]
  }
}

output {
  elasticsearch {
    hosts  => ["${ES_HOSTS}"]
    user   => "${ES_USERNAME}"
    password => "${ES_PASSWORD}"

    index => "tmlibrary_books"

    # isbn 是业务主键 —— 拿它当 _id,同一本书反复同步只会覆盖不会重复
    document_id => "%{isbn}"

    # 关键:upsert。有则整篇覆盖,无则新建
    doc_as_upsert => true

    # 关掉 ILM —— 这是业务索引,不该被 rollover 成 tmlibrary_books-000001
    ilm_enabled => false

    # 同步完立刻刷新,否则"改完书要等 1 秒才能在搜索里看到"
    # (只影响这一批,代价可接受;不在意的话删掉这行)
    refresh => true
  }

  # 同步过程的日志 —— 排查"为什么某本书没进索引"时看这里
  stdout {
    codec => rubydebug { metadata => false }
  }
}
