spring:
  application:
    name: TMLibrary
  profiles:
    active: dev

  main:
    # 关掉 Spring Boot 的 ASCII art banner —— 容器日志里那几行图案没有信息量,
    # 只会把真正的启动日志顶出屏幕
    banner-mode: off
    # 关掉 "The following 1 profile is active: dev" 这类启动信息。
    # 启动是否成功由我们自己的日志说(见 logback-spring.xml)
    log-startup-info: false

  datasource:
    # URL / 用户名 / 密码一律从环境变量读，本地开发启动前请执行：
    #   export DB_URL='jdbc:mysql://localhost:3306/tmlibrary?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai'
    #   export DB_USERNAME='root'
    #   export DB_PASSWORD='your_password'
    # 留空默认值是故意的——让缺环境变量时启动失败，避免再把密码写进 yml
    url:      ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  # output:
  #   ansi:
  #     enabled: ALWAYS

# CORS 允许的 origin / origin-pattern — 逗号分隔
# WebMvcConfig 通过 @Value("${app.cors.origins:...}") 读取,
# 走 Spring 的 allowedOriginPatterns(精确值 + 通配符都支持)
#
# 写法:
#   - 精确:http://localhost:5173
#   - 通配端口:http://localhost:[*]  ← [*] 表示任意端口
#
# 为什么用 [*]:vite dev server 端口会漂移 —— 5173 被占用就自动换 5174、5175…
# 精确白名单每次都要改配置 + 重启后端,否则前端满屏 "403 Invalid CORS request"。
# localhost / 127.0.0.1 只可能是本机来源,别人网站域名匹配不上,dev 场景安全。
#
# ⚠️ 生产环境必须用环境变量覆盖成精确域名,不要保留 [*]:
#   APP_CORS_ORIGINS=https://admin.example.com
app:
  # ============================================================
  # 用户注册
  # ============================================================
  user:
    # 新注册用户的角色。取值必须是枚举名且大写:USER / ADMIN / BOSS
    # (写小写会在启动时直接失败,这是故意的 —— 配错就该起不来)。
    #
    # 默认 USER —— 权限只能由 BOSS 事后提升(见 UserManagementServiceImpl.updateUser
    # 里「仅 BOSS 可修改用户角色」那条)。这是安全默认值:注册接口是公开的,
    # 默认给高权限等于「谁注册谁是管理员」。
    #
    # 想临时测试管理员能力(本地 / 内网),用环境变量打开即可,不用改这个文件:
    #   export REGISTER_DEFAULT_ROLE=ADMIN
    #
    # 代码侧还有一层兜底:UserManagementServiceImpl.registerDefaultRole 的
    # @Value 默认值也是 USER,所以把这个 key 整行删掉同样安全。
    register-default-role: ${REGISTER_DEFAULT_ROLE:USER}

  cors:
    origins: http://127.0.0.1:[*]

  # ============================================================
  # 前端地址 —— 目前只用于拼「密码重置」邮件里的链接
  #
  # 必须是**浏览器能访问到的**地址,不是后端地址。填错用户收到的链接
  # 就打不开。生产改成真实域名,例如 https://library.example.com
  # ============================================================
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:5173}

  # ============================================================
  # 邮件 —— 目前只服务于「忘记密码」
  #
  # 发件人地址。多数 SMTP 服务要求 From 与认证账号同域,
  # 否则会被拒信或进垃圾箱。
  #
  # SMTP 服务器本身配在 spring.mail.* 下(Spring Boot 标准键):
  #   spring.mail.host / port / username / password
  # **没配 spring.mail.host 就不会创建 JavaMailSender Bean**,
  # 邮件实现自动退回 LoggingMailService(把重置链接打进日志)——
  # 本地开发不装任何邮件服务也能走通整个流程。
  # ============================================================
  mail:
    from: ${MAIL_FROM:no-reply@tmlibrary.local}

  # Snowflake 发号器标识 —— 多实例部署时每个实例必须不同,否则订单号会撞
  # (单实例可保持默认)
  snowflake:
    worker-id: ${SNOWFLAKE_WORKER_ID:1}          # 0-31
    datacenter-id: ${SNOWFLAKE_DATACENTER_ID:1}  # 0-31

  book:
    # SingleFlight 中 follower 等待 leader 查库的最长时间(毫秒)
    singleflight-timeout-ms: 5000

  # ============================================================
  # Elasticsearch —— 搜索建议 / 关键字搜索走 ES
  #
  # 单机 docker dev 环境默认配置;生产改为主备集群 URL,用逗号分隔多 host。
  # user/pass 从环境变量读,见 .env.example。
  # ============================================================
  search:
    elasticsearch:
      # 集群地址:localhost:9200 是 docker dev 起的容器
      hosts: ${ES_HOSTS:http://localhost:9200}
      username: ${ES_USERNAME:elastic}
      password: ${ES_PASSWORD:}
      # 索引名集中在这里,后续接 search profile 时按同一前缀建即可
      suggest-index: ${ES_SUGGEST_INDEX:tmlibrary_books_suggest}
      book-index:    ${ES_BOOK_INDEX:tmlibrary_books}
      # 连接超时 / 请求超时(毫秒)—— 默认 1s,搜索是热路径,超时比打 DB 还慢就降级
      connect-timeout-ms: ${ES_CONNECT_TIMEOUT_MS:1000}
      socket-timeout-ms:  ${ES_SOCKET_TIMEOUT_MS:2000}

  # IP 风控 —— 高频请求(脚本攻击)自动封禁
  # 判定在 IpRiskControlFilter(每个 /* 请求),计数走 Redis,封禁记录落 ip_bans 表
  security:
    ip-ban:
      # 总开关 —— 本地压测/调试时可以设 false 关掉
      enabled: ${IP_BAN_ENABLED:true}
      # 单个窗口内允许的最大请求数;超过即封禁
      # 150 次的依据:正常用户一次页面加载约 5-10 个请求,1 分钟很难超过 150;
      # 脚本扫描/爆破通常每秒几十次,几秒内就会触发
      max-requests: ${IP_BAN_MAX_REQUESTS:150}
      # 计数窗口长度(秒)
      window-seconds: ${IP_BAN_WINDOW_SECONDS:60}
      # 封禁时长(小时)
      ban-hours: ${IP_BAN_HOURS:24}
      # 是否信任回环/私网地址(127.0.0.1、10.x、192.168.x…),默认信任 = 不参与风控。
      # 想在本机演示封禁弹窗:设 false,然后脚本高频刷接口即可触发
      # (演示完记得改回 true,否则开发时自己会被封 24 小时)
      # ⚠️ 生产挂在反向代理后面时必须设 false —— 否则所有请求的 remoteAddr
      #    都是网关的内网 IP,一律被当成"可信"放行,风控形同虚设。
      trust-private-ips: ${IP_BAN_TRUST_PRIVATE_IPS:true}

      # 可信反向代理地址(逗号分隔)。**默认空 = 不信任任何代理头。**
      #
      # X-Forwarded-For 是客户端可以随便写的:早期实现直接取它的第一段,
      # 攻击者每次换一个值就能绕过计数封禁,甚至伪造别人的 IP 把人封掉。
      # 现在只有当直连方(remoteAddr)在这个名单里,才会从 XFF 右侧往左
      # 取第一个不可信地址(nginx realip 的算法)。
      #
      # 什么时候需要配:应用挂在 Nginx/网关后面,**且网关覆盖**(不是透传)
      # X-Forwarded-For 时。例如网关在宿主机:
      #   IP_BAN_TRUSTED_PROXIES=127.0.0.1
      # 直连部署 / 容器直连 → 保持为空,这是最安全的默认值。
      trusted-proxies: ${IP_BAN_TRUSTED_PROXIES:}

# Actuator / 指标
# ⚠️ 注意:JwtAuthFilter 只注册在 /* 上,actuator 端点不走鉴权。
#    这里仅暴露 health 与 metrics;生产环境建议用独立 management 端口,
#    或在网关层限制访问来源。
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: when-authorized

mybatis:
  # XML mapper location — hand-written SQL goes here, one XML per mapper interface
  # mapper-locations: classpath:mapper/*.xml 是 MyBatis 扫描的 XML 映射文件路径，多个路径用逗号分隔
  mapper-locations: classpath:mapper/*.xml
  # Type aliases let XML refer to "Book" instead of "com.tmt.TMLibrary.entity.Book"
  # type-aliases-package: 是 MyBatis 扫描的实体类包路径，多个包用逗号分隔
  type-aliases-package: com.tmt.TMLibrary.entity
  # log-impl 由 MyBatisConfig 手动设(因 SB starter 与 SB 4.x 不兼容,yml 这块读不到)
  # 默认值: org.apache.ibatis.logging.stdout.StdOutImpl(打到控制台)
  # 生产想关掉可设: mybatis.log-impl=org.apache.ibatis.logging.nologging.NoLoggingImpl
  # 例如: mybatis.log-impl=org.apache.ibatis.logging.nologging.NoLoggingImpl

# logback-spring.xml 和 application.yml 里都可以配置日志,但 logback-spring.xml 更灵活,可按环境变量或 profile 分文件配置
# logging:
#   file:
#     name: /opt/logs/tmlibrary.log
#     logback:
#       rollingpolicy:
#         max-file-size: 10MB
#         max-history: 30
#     level:
#       root: INFO
