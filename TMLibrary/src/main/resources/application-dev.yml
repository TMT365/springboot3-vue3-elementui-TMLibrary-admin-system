# Local development overrides (auto-merged on top of application.yml).
# MySQL connection details — match your local install.
# 密码、用户名、URL 仍由环境变量注入，本文件不再放任何敏感信息。
# 启动前执行：
#   export DB_URL='jdbc:mysql://localhost:3306/tmlibrary?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai'
#   export DB_USERNAME='root'
#   export DB_PASSWORD='your_password'
spring:
  datasource:
    url:      ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  # Redis 配置
  # 凭据一律从环境变量读(与 datasource 同样策略)——
  # 不要把密码写进 yml,本文件是 git 跟踪的
  #   export REDIS_USERNAME=''        # Redis 6+ ACL 用户名;默认用户留空
  #   export REDIS_PASSWORD=''
  data:
    redis:
      username : ${REDIS_USERNAME:}
      password : ${REDIS_PASSWORD:}
      port : ${REDIS_PORT:6379}
      host : ${REDIS_HOST:localhost}
      timeout: 2000ms # 命令超时时间
      database : 0
      # lettuce连接池配置，需要commons‑pool2才生效
      lettuce:
        pool:
          enabled : true
          max-active: 8   #最大连接数
          max-idle: 8     #最大空闲
          min-idle: 2     #最小空闲
          max-wait: 500ms #获取连接最大等待时间


# JWT 密钥必须从环境变量注入 —— 泄露后可伪造任意用户令牌
#   export JWT_SECRET="$(openssl rand -base64 48)"   # 至少 32 字节
# 轮换密钥会让所有已签发 token 立即失效,需配合发布窗口操作
jwt:
  secret: ${JWT_SECRET:}
  expiration-seconds: ${JWT_EXPIRATION_SECONDS:604800}

