# ============================================================================
# TMLibrary 前端 nginx 配置
#
# 两件事:
#   1. 托管 SPA 静态文件 —— history 模式下所有未知路径都要回落到 index.html
#   2. 把 /api 反向代理到后端 —— 前端代码里全是相对路径,不知道后端在哪
#
# 为什么用 nginx 代理而不是让前端直连后端:
#   同源。浏览器眼里只有 nginx 这一个源,不存在跨域,
#   后端那份 CORS 白名单(app.cors.origins)在生产上可以收紧到只列前端域名。
#
# 后端地址由 docker-compose 的服务名解析(backend:8080),
# 也可以通过环境变量 BACKEND_UPSTREAM 覆盖(见 docker-compose.yml)。
# ============================================================================

# Docker 内置 DNS。加 valid=10s 是为了:后端容器重建后 IP 变了,
# nginx 缓存的老 IP 会一直 502 —— 10 秒后重新解析就好了。
# (nginx 只在启动时解析一次 upstream 里的主机名,这是经典坑)
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # ---- 压缩 ----
    # 前端产物是 JS/CSS 为主,压缩收益很大(实测 gzip 后约 1/4)
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ---- 安全响应头 ----
    add_header X-Content-Type-Options "nosniff"        always;
    add_header X-Frame-Options        "SAMEORIGIN"     always;
    add_header Referrer-Policy        "no-referrer-when-downgrade" always;

    # ---- 带 hash 的静态资源:长缓存 ----
    # Vite 产物文件名里带内容 hash(index-<hash>.js),内容变了文件名就变,
    # 所以可以放心让浏览器缓存一年
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 自托管的第三方库(Chart.js),同样按文件名版本化
    location /vendor/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ---- index.html 不缓存 ----
    # 它引用的就是上面那些带 hash 的文件;一旦缓存住,
    # 发新版本后用户会一直加载旧的 index.html → 指向已删除的旧 chunk
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ---- API 反向代理 ----
    location /api/ {
        # 用变量 + resolver:让 nginx 每次重新解析 backend,
        # 后端容器换 IP 后不需要重启前端容器
        set $backend_upstream "${BACKEND_UPSTREAM}";
        proxy_pass http://$backend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # X-Forwarded-For 必须带 —— 后端 IpRiskControlFilter 靠它识别真实客户端 IP。
        # 注意后端只有在 IP_BAN_TRUSTED_PROXIES 里配置了本 nginx 的地址时才会采信这个头
        # (否则任何人都能伪造 XFF 绕过封禁),见 application.yml / .env.example
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 反馈抽屉提交大段文字、批量导入等场景,默认 1MB 偏小
        client_max_body_size 10m;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # 后端健康检查(方便运维直接打前端端口看后端活没活)
    location = /health {
        set $backend_upstream "${BACKEND_UPSTREAM}";
        proxy_pass http://$backend_upstream/actuator/health;
        access_log off;
    }

    # ---- SPA 回落 ----
    # vue-router 用 history 模式,/admin/books 这类路径在服务器上并不存在真实文件。
    # 直接刷新会 404,所以统一回落到 index.html 交给前端路由处理。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 隐藏 nginx 版本号
    server_tokens off;
}
