<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4CAF50" />
    <meta name="color-scheme" content="light dark" />
    <meta name="format-detection" content="telephone=no, email=no, address=no" />

    <!-- SEO:基础描述 -->
    <meta name="description" content="TMLibrary — 一个使用 Vue 3 + Spring Boot 构建的图书管理系统,支持图书 / 订单 / 用户全流程管理。" />
    <meta name="keywords" content="图书管理,library,Vue 3,Spring Boot,Java,TypeScript,Element Plus,开源" />
    <meta name="author" content="TMLibrary" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph(Facebook / LinkedIn / Twitter 通用) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="TMLibrary — 图书管理系统" />
    <meta property="og:description" content="一个使用 Vue 3 + Spring Boot 构建的图书管理系统,支持图书 / 订单 / 用户全流程管理。" />
    <meta property="og:image" content="/og-cover.svg" />
    <meta property="og:url" content="/" />
    <meta property="og:site_name" content="TMLibrary" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:type" content="website" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TMLibrary — 图书管理系统" />
    <meta name="twitter:description" content="Vue 3 + Spring Boot 图书 / 订单 / 用户 全流程管理。" />
    <meta name="twitter:image" content="/og-cover.svg" />

    <!-- iOS / 移动端 PWA 入口标记 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TMLibrary" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Microsoft tile -->
    <meta name="msapplication-TileColor" content="#4CAF50" />

    <!-- 全站字体(Google Fonts,一次请求取三个字族)
         Inter       — 数字 / 代码类文本(订单号、金额、ISBN),tabular-nums 对齐
         Manrope     — 正文 sans(theme.css 的 body 字体)
         DM Serif Display — display 标题(页面大标题、卡片标题)
         三个字族在项目 CSS 里被引用 88 次;之前只请求了 Inter,
         另两个一直走 Georgia / system-ui 兜底 —— 设计字形根本没生效。 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap"
    />

    <title>TMLibrary — 图书管理系统</title>

    <!-- Chart.js(自托管,不走 CDN)—— 仪表盘统计图用
         原先挂 jsdelivr CDN,实测国内加载要 6+ 秒,而且它是 head 里的**阻塞脚本**:
         慢 → 整个页面白屏等它;失败/超时 → window.Chart 不存在,图表永远不显示。
         现改为放 public/vendor/ 由本地同源提供(202KB,即时加载),并加 defer 不阻塞解析。
         版本来源:https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js -->
    <script defer src="/vendor/chart.umd.min.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
